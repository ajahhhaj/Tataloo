name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin autoconf-archive pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "cython==0.29.37"
      - name: Build
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: tataloo-code-apk
          path: bin/*.apk
