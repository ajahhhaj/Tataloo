
name: Tataloo Code Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tataloo Code APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install editor dependencies
        working-directory: editor-source
        run: npm install

      - name: Build offline editor
        working-directory: editor-source
        run: npm run build

      - name: Verify editor assets
        run: |
          test -f app/src/main/assets/editor/index.html
          test -f app/src/main/assets/editor/editor.js
          echo "Editor assets verified"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tataloo-Code-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
